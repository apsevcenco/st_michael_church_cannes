services:
  - type: web
    name: st-michael-church-cannes-frontend
    runtime: static
    repo: https://github.com/apsevcenco/st_michael_church_cannes.git
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https://mkaxtebegspaetwoxfgq.supabase.co https://commons.wikimedia.org https://upload.wikimedia.org; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://st-michael-church-cannes.onrender.com https://st-michael-church-cannes-backend.onrender.com https://mkaxtebegspaetwoxfgq.supabase.co wss://mkaxtebegspaetwoxfgq.supabase.co; frame-src https://www.openstreetmap.org; worker-src 'self' blob: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

  - type: web
    name: st-michael-church-cannes-backend
    runtime: node
    repo: https://github.com/apsevcenco/st_michael_church_cannes.git
    branch: main
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_ORIGIN
        value: "https://st-michael-church-cannes-frontend.onrender.com"
      - key: SUPABASE_URL
        value: "https://mkaxtebegspaetwoxfgq.supabase.co"
      - key: SUPABASE_ANON_KEY
        value: "eyJhbGciOiJIUzI1NiIsInJlZiI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Im1rYXh0ZWJlZ3NwYWV0d294ZmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTQ4NDEsImV4cCI6MjA5NzQ3MDg0MX0.BLybwmqb2BhiKTYWZSYPbYuXPnNNU400dkHm1qVWOqc"
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
