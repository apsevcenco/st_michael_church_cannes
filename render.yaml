services:
  - type: web
    name: st-michael-church-cannes-frontend
    runtime: static
    repo: https://github.com/apsevcenco/st_michael_church_cannes.git
    branch: main
    rootDir: frontend
    buildCommand: echo "No frontend build step"
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: https://mkaxtebegspaetwoxfgq.supabase.co https://commons.wikimedia.org https://upload.wikimedia.org; font-src 'self'; connect-src 'self' https://mkaxtebegspaetwoxfgq.supabase.co wss://mkaxtebegspaetwoxfgq.supabase.co; frame-src https://www.openstreetmap.org https://mkaxtebegspaetwoxfgq.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

  - type: web
    name: st-michael-church-cannes-backend
    runtime: node
    repo: https://github.com/apsevcenco/st_michael_church_cannes.git
    branch: main
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_ORIGIN
        value: "https://st-michael-church-cannes-frontend.onrender.com"
